name: kwikoneckt

services:
  db:
    image: postgres:16
    container_name: kk-db-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: kwikonekt
    ports:
      - '5432:5432'
    volumes:
      - kk-postgres-data:/var/lib/postgresql/data
    
volumes:
  kk-postgres-data:
